<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player | PhysicsChainOnline</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
</head>

<body style="
    padding: 0;
    margin: 0;
    overflow: hidden;
    background-color: #EEEEEE;
  ">
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas"></canvas>
    <div id="unity-loading-bar" role="status" aria-live="polite">
      <div class="loading-card">
        <div class="loading-scene" aria-hidden="true">
          <div class="loading-chain loading-chain-left">
            <span></span><span></span><span></span>
          </div>
          <div id="unity-logo"></div>
          <div class="loading-chain loading-chain-right">
            <span></span><span></span><span></span>
          </div>
          <div class="loading-shadow"></div>
        </div>
        <p class="loading-title">PHYSICS CHAIN ONLINE</p>
        <div class="loading-message">
          <span id="loading-status">ゲームを準備しています</span>
          <span id="loading-percent">0%</span>
        </div>
        <div id="unity-progress-bar-empty"
          role="progressbar"
          aria-label="ゲームの読み込み状況"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0">
          <div id="unity-progress-bar-full"></div>
        </div>
        <p class="loading-hint">鎖をつないでいます<span class="loading-dots" aria-hidden="true"><i></i><i></i><i></i></span></p>
      </div>
    </div>
  </div>


  <script>
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var progressBar = document.querySelector("#unity-progress-bar-empty");
    var loadingStatus = document.querySelector("#loading-status");
    var loadingPercent = document.querySelector("#loading-percent");


    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/ver1.9.loader.js";
    var config = {
        dataUrl: buildUrl + "/ver1.9.data.unityweb",
        frameworkUrl: buildUrl + "/ver1.9.framework.js.unityweb",
        codeUrl: buildUrl + "/ver1.9.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "PhysicsChainOnline",
        productVersion: "1.9",
      };

    // By default Unity keeps WebGL canvas render target size matched with
    // the DOM size of the canvas element (scaled by window.devicePixelRatio)
    // Set this to false if you want to decouple this synchronization from
    // happening inside the engine, and you would instead like to size up
    // the canvas DOM size and WebGL render target sizes yourself.
    // config.matchWebGLToCanvasSize = false;

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      config.devicePixelRatio = 1;
    }


    canvas.style.width = "100%";
    canvas.style.height = "100%";

    loadingBar.style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        var percent = Math.min(100, Math.round(100 * progress));
        progressBarFull.style.width = percent + "%";
        progressBar.setAttribute("aria-valuenow", percent);
        loadingPercent.textContent = percent + "%";

        if (percent < 25) {
          loadingStatus.textContent = "ゲームデータを読み込んでいます";
        } else if (percent < 70) {
          loadingStatus.textContent = "ステージを組み立てています";
        } else if (percent < 95) {
          loadingStatus.textContent = "物理世界を準備しています";
        } else {
          loadingStatus.textContent = "まもなくスタート！";
        }
      }).then((unityInstance) => {
        loadingPercent.textContent = "100%";
        loadingStatus.textContent = "準備完了！";
        progressBarFull.style.width = "100%";
        loadingBar.classList.add("is-complete");
        window.setTimeout(() => {
          loadingBar.style.display = "none";
        }, 450);
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
  <script>
    //キャンバスのサイズ
    function reCanvasSize() {
      wsize = $(window).width();
      hsize = $(window).height();
      $('canvas').attr('width', wsize);
      $('canvas').attr('height', hsize);
    }

    $(document).ready(function () {
      reCanvasSize();
    });
    $(window).resize(function () {
      reCanvasSize();
    });
  </script>

</body>

</html>
